name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/android@^7.4.0 @capacitor/assets@^3.0.1 --legacy-peer-deps

      - name: Fix Capacitor webDir configuration
        run: |
          sed -i 's/"webDir":\s*"."/"webDir": "www"/g' capacitor.config.json 2>/dev/null || true
          sed -i 's/webDir:\s*"\."/webDir: "www"/g' capacitor.config.ts 2>/dev/null || true
          sed -i "s/webDir:\s*'\.'/webDir: 'www'/g" capacitor.config.ts 2>/dev/null || true

      - name: Build web project
        run: npm run build --if-present

      - name: Prepare web assets directory
        run: |
          mkdir -p www
          if [ -d "dist" ]; then cp -r dist/* www/ 2>/dev/null || true; fi
          if [ -d "build" ]; then cp -r build/* www/ 2>/dev/null || true; fi
          if [ -f "index.html" ]; then cp index.html www/ 2>/dev/null || true; fi
          if [ ! -f "www/index.html" ]; then echo "Quesi-Helper App" > www/index.html; fi

      - name: Prepare app icon (logo Fanáticos de la Pizza)
        run: |
          mkdir -p assets
          base64 -d assets/icon-base64.txt > assets/icon.png
          base64 -d assets/icon-base64.txt > assets/icon-foreground.png
          base64 -d assets/icon-background-base64.txt > assets/icon-background.png
          file assets/icon.png assets/icon-foreground.png assets/icon-background.png

      - name: Sync Capacitor Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          mkdir -p android/app/src/main/assets
          if [ -f "adi-registration.properties" ]; then cp adi-registration.properties android/app/src/main/assets/; fi
          npx cap sync android

      - name: Generate App Icons from logo
        run: |
          npx @capacitor/assets generate --android
          ls android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          ls android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Mostrar huella SHA-256
        run: keytool -printcert -jarfile "${{ steps.sign_app.outputs.signedReleaseFile }}" | grep "SHA256:"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: QuesiHelper-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 7
