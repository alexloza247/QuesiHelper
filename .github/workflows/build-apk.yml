- name: Sign APK and show SHA-256
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -f -p 4 android/app/build/outputs/apk/debug/app-debug.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --v1-signing-enabled true \
            --ks release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out QuesiHelper-signed.apk \
            app-aligned.apk
          rm -f release.jks app-aligned.apk
          keytool -printcert -jarfile QuesiHelper-signed.apk | grep "SHA256:"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: QuesiHelper-APK
          path: QuesiHelper-signed.apk
          retention-days: 7
