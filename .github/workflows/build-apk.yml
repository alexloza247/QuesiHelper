name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/android@^7.4.0 @capacitor/assets@^3.0.1 --legacy-peer-deps

      - name: Fix Capacitor webDir configuration
        run: |
          sed -i 's/"webDir":\s*"."/"webDir": "www"/g' capacitor.config.json 2>/dev/null || true
          sed -i 's/webDir:\s*"\."/webDir: "www"/g' capacitor.config.ts 2>/dev/null || true
          sed -i "s/webDir:\s*'\.'/webDir: 'www'/g" capacitor.config.ts 2>/dev/null || true

      - name: Build web project
        run: npm run build --if-present

      - name: Prepare web assets directory
        run: |
          mkdir -p www
          if [ -d "dist" ]; then cp -r dist/* www/ 2>/dev/null || true; fi
          if [ -d "build" ]; then cp -r build/* www/ 2>/dev/null || true; fi
          if [ -f "index.html" ]; then cp index.html www/ 2>/dev/null || true; fi
          if [ ! -f "www/index.html" ]; then echo "Quesi-Helper App" > www/index.html; fi

      - name: Prepare app icon (logo Fanáticos de la Pizza)
        run: |
          mkdir -p assets
          base64 -d assets/icon-base64.txt > assets/icon.png
          base64 -d assets/icon-base64.txt > assets/icon-foreground.png
          base64 -d assets/icon-background-base64.txt > assets/icon-background.png
          file assets/icon.png assets/icon-foreground.png assets/icon-background.png

      - name: Sync Capacitor Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          mkdir -p android/app/src/main/assets
          if [ -f "adi-registration.properties" ]; then cp adi-registration.properties android/app/src/main/assets/; fi
          npx cap sync android

      - name: Generate App Icons from logo
        run: |
          npx @capacitor/assets generate --android
          ls android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          ls android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Update Android app version
        run: |
          RUN_NUM=${{ github.run_number }}
          BASE_VER=$(node -p "try { (require('./package.json').version || '1.0.0').split('.').slice(0,2).join('.') } catch(e) { '1.0' }")
          NEW_VERSION="${BASE_VER}.${RUN_NUM}"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${RUN_NUM}/" android/app/build.gradle
          sed -i -E "s/versionName[[:space:]]+\"[^\"]+\"/versionName \"${NEW_VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK and show SHA-256
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -f -p 4 android/app/build/outputs/apk/debug/app-debug.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --v1-signing-enabled true \
            --ks release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out QuesiHelper-signed.apk \
            app-aligned.apk
          rm -f release.jks app-aligned.apk
          keytool -printcert -jarfile QuesiHelper-signed.apk | grep "SHA256:"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: QuesiHelper-APK
          path: QuesiHelper-signed.apk
          retention-days: 7
